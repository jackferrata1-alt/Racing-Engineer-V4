<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Engineer V4.2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div>
        <h1>RACING ENGINEER <span>V4.2</span></h1>
        <p>Custom Push-Lap Engineer</p>
    </div>

    <div id="status" class="status">READY</div>
</header>

<main>

    <!-- TRACK + TARGET -->
    <section class="panel controls">

        <div class="control">
            <label>TRACK</label>

            <select id="trackSelect">
                <option value="spa">Spa-Francorchamps</option>
                <option value="bahrain">Bahrain</option>
                <option value="jeddah">Jeddah</option>
                <option value="australia">Australia</option>
                <option value="japan">Japan</option>
                <option value="miami">Miami</option>
                <option value="imola">Imola</option>
                <option value="monaco">Monaco</option>
                <option value="canada">Canada</option>
                <option value="austria">Austria</option>
                <option value="britain">Great Britain</option>
                <option value="hungary">Hungary</option>
                <option value="belgium">Belgium</option>
                <option value="netherlands">Netherlands</option>
                <option value="italy">Italy</option>
                <option value="azerbaijan">Azerbaijan</option>
                <option value="singapore">Singapore</option>
                <option value="usa">United States</option>
                <option value="mexico">Mexico</option>
                <option value="brazil">Brazil</option>
                <option value="lasvegas">Las Vegas</option>
                <option value="qatar">Qatar</option>
                <option value="abudhabi">Abu Dhabi</option>
            </select>
        </div>

        <div class="control">
            <label>TARGET LAP</label>

            <div class="timeInput">
                <input id="minutes" type="number" min="0" max="9" value="1">
                <span>:</span>
                <input id="seconds" type="number" min="0" max="59" value="45">
                <span>.</span>
                <input id="milliseconds" type="number" min="0" max="999" value="0">
            </div>
        </div>

    </section>


    <!-- DASHBOARD -->
    <section class="dashboard">

        <div class="metric panel">
            <span>CURRENT LAP</span>
            <strong id="currentLap">0:00.000</strong>
        </div>

        <div class="metric panel">
            <span>TARGET DELTA</span>
            <strong id="delta">+0:00.000</strong>
        </div>

        <div class="metric panel">
            <span>BEST LAP</span>
            <strong id="bestLap">--:--.---</strong>
        </div>

    </section>


    <!-- ENGINEER -->
    <section class="panel engineer">

        <div class="engineerHeader">
            <span>ENGINEER</span>
            <span id="cornerCounter">READY</span>
        </div>

        <div id="call">PUSH LAP READY</div>

        <div id="subCall">
            Configure your notes below.
        </div>

    </section>


    <!-- BUTTONS -->
    <section class="buttons">

        <button id="startBtn" class="primary">
            START PUSH LAP
        </button>

        <button id="pauseBtn" disabled>
            PAUSE
        </button>

        <button id="stopBtn">
            STOP
        </button>

        <button id="speakBtn">
            TEST ENGINEER
        </button>

    </section>


    <!-- NOTE EDITOR -->
    <section class="panel editor">

        <div class="sectionTitle">
            <div>
                <h2>ENGINEER NOTES</h2>
                <p>Configure exactly when each call plays.</p>
            </div>

            <button id="addNoteBtn" class="primary small">
                + ADD NOTE
            </button>
        </div>


        <div class="noteControls">

            <div>
                <label>EDITING TRACK</label>
                <strong id="editingTrack">
                    Spa-Francorchamps
                </strong>
            </div>

            <div>
                <label>TIMING MODE</label>

                <select id="timingMode">
                    <option value="absolute">
                        Absolute Time
                    </option>

                    <option value="percentage">
                        Lap Percentage
                    </option>
                </select>
            </div>

        </div>


        <div id="notesList"></div>

    </section>


    <!-- TIME LOG -->
    <section class="panel logPanel">

        <div class="sectionTitle">
            <h2>TIME LOG</h2>

            <button id="clearLog">
                CLEAR
            </button>
        </div>

        <div id="timeLog">
            <div class="empty">
                No completed laps.
            </div>
        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
