<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Engineer V4.3</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div>
        <h1>RACING ENGINEER <span>V4.3</span></h1>
        <p>Push Lap Race Engineer</p>
    </div>

    <div id="status" class="status">READY</div>
</header>

<main>

    <section class="panel controls">

        <div class="control">
            <label>TRACK</label>

            <select id="trackSelect"></select>
        </div>

        <div class="control">
            <label>TARGET LAP</label>

            <div class="timeInput">
                <input id="minutes" type="number" min="0" max="9" value="1">
                <span>:</span>
                <input id="seconds" type="number" min="0" max="59" value="45">
                <span>.</span>
                <input id="milliseconds" type="number" min="0" max="999" value="0">
            </div>

        </div>

    </section>


    <section class="dashboard">

        <div class="metric panel">
            <span>CURRENT LAP</span>
            <strong id="currentLap">0:00.000</strong>
        </div>

        <div class="metric panel">
            <span>TARGET DELTA</span>
            <strong id="delta">+0:00.000</strong>
        </div>

        <div class="metric panel">
            <span>BEST LAP</span>
            <strong id="bestLap">--:--.---</strong>
        </div>

    </section>


    <section class="panel engineer">

        <div class="engineerHeader">
            <span>ENGINEER</span>
            <span id="cornerCounter">READY</span>
        </div>

        <div id="call">PUSH LAP READY</div>

        <div id="subCall">
            Select a track and start your lap.
        </div>

    </section>


    <section class="buttons">

        <button
    id="startBtn"
    class="primary"
    onclick="startLap()">
    START PUSH LAP
        </button>

        <button id="pauseBtn" disabled>
            PAUSE
        </button>

        <button id="stopBtn">
            STOP
        </button>

        <button id="speakBtn">
            TEST ENGINEER
        </button>

    </section>


    <!-- TRACK EDITOR -->

    <section class="panel editor">

        <div class="sectionTitle">

            <div>
                <h2>TRACK ENGINEER</h2>

                <p>
                    Configure every call on the selected circuit.
                </p>
            </div>

            <button id="addNoteBtn" class="primary small">
                + ADD CALL
            </button>

        </div>


        <div class="editorControls">

            <div>
                <label>TRACK</label>
                <strong id="editingTrack">
                    -
                </strong>
            </div>

            <div>
                <label>TIMING MODE</label>

                <select id="timingMode">

                    <option value="absolute">
                        Absolute Time
                    </option>

                    <option value="percentage">
                        Lap Percentage
                    </option>

                </select>

            </div>

        </div>


        <div class="filterRow">

            <button
                class="filter active"
                data-filter="all">
                ALL
            </button>

            <button
                class="filter"
                data-filter="BRAKE">
                BRAKE
            </button>

            <button
                class="filter"
                data-filter="TURN">
                TURN
            </button>

            <button
                class="filter"
                data-filter="APEX">
                APEX
            </button>

            <button
                class="filter"
                data-filter="EXIT">
                EXIT
            </button>

            <button
                class="filter"
                data-filter="CUSTOM">
                CUSTOM
            </button>

        </div>


        <div id="notesList"></div>

    </section>


    <!-- LAP LOG -->

    <section class="panel logPanel">

        <div class="sectionTitle">

            <h2>TIME LOG</h2>

            <button id="clearLog">
                CLEAR
            </button>

        </div>

        <div id="timeLog">

            <div class="empty">
                No completed laps.
            </div>

        </div>

    </section>

</main>

<script src="tracks.js"></script>
<script src="script.js"></script>

</body>
</html>
